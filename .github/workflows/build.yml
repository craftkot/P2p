name: Build OpenTogether

on:
  push:
  workflow_dispatch:

concurrency:
  group: opentogether-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - run: echo "GitHub hosted runner started"
      - uses: actions/checkout@v4
      - run: |
          pwd
          ls -la
          test -f build.gradle
  build:
    needs: sanity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Test Java STUN parser without Forge dependencies
        shell: bash
        run: |
          mkdir -p build/stun-tests
          javac --release 17 -d build/stun-tests src/main/java/dev/opentogether/StunProbe.java src/test/java/dev/opentogether/StunProbeTest.java
          java -cp build/stun-tests dev.opentogether.StunProbeTest
      - name: Test invitation code normalization
        shell: bash
        run: |
          mkdir -p build/code-tests
          javac --release 17 -d build/code-tests src/main/java/dev/opentogether/InviteCode.java src/test/java/dev/opentogether/InviteCodeTest.java
          java -cp build/code-tests dev.opentogether.InviteCodeTest
      - name: Test public invitation hostname parser
        shell: bash
        run: |
          mkdir -p build/address-tests
          javac --release 17 -d build/address-tests src/main/java/dev/opentogether/InviteAddress.java src/test/java/dev/opentogether/InviteAddressTest.java
          java -cp build/address-tests dev.opentogether.InviteAddressTest
      - run: node --check cloudflare/src/index.js
      - name: Test Cloudflare invitations
        run: node --test cloudflare/test/*.test.mjs
      - name: Stage bundled upstream e4mc 6.2.3
        run: bash ci/prepare-e4mc.sh
      - name: Build Forge one-JAR distribution
        run: gradle --no-daemon clean jarJar --stacktrace
      - name: Verify nested e4mc exists
        run: |
          python3 - <<'PY'
          import glob,zipfile,io
          jars=glob.glob('build/libs/*-all.jar')
          assert len(jars)==1, jars
          with zipfile.ZipFile(jars[0]) as z:
            nest=[n for n in z.namelist() if n.startswith('META-INF/jarjar/') and n.endswith('.jar')]
            assert len(nest)==1, nest
            assert 'licenses/e4mc-MIT.txt' in z.namelist()
            assert 'MixinConfigs: opentogether.mixins.json' in z.read('META-INF/MANIFEST.MF').decode('utf-8')
            assert 'opentogether.mixins.json' in z.namelist()
            assert 'version="0.6.0-alpha"' in z.read('META-INF/mods.toml').decode()
            with zipfile.ZipFile(io.BytesIO(z.read(nest[0]))) as inner:
              assert 'modId = "e4mc"' in inner.read('META-INF/mods.toml').decode()
          print('Single-file Forge/e4mc packaging verified')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opentogether-onejar-forge-1.20.1
          path: build/libs/*-all.jar
          if-no-files-found: error
