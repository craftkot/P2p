name: Build OpenTogether Forge 1.20.1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate Cloudflare source
        run: node --check cloudflare/src/index.js
      - name: Build Forge mod
        run: gradle --no-daemon build --stacktrace
      - name: Upload JAR and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opentogether-forge-1.20.1
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
