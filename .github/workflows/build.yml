name: Build OpenTogether

on:
  push:
  workflow_dispatch:

concurrency:
  group: opentogether-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - run: echo "GitHub hosted runner started"
      - uses: actions/checkout@v4
      - run: |
          pwd
          ls -la
          test -f build.gradle
  build:
    needs: sanity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Test Java STUN parser without Forge dependencies
        shell: bash
        run: |
          mkdir -p build/stun-tests
          javac --release 17 -d build/stun-tests src/main/java/dev/opentogether/StunProbe.java src/test/java/dev/opentogether/StunProbeTest.java
          java -cp build/stun-tests dev.opentogether.StunProbeTest
      - name: Test invitation code normalization
        shell: bash
        run: |
          mkdir -p build/code-tests
          javac --release 17 -d build/code-tests src/main/java/dev/opentogether/InviteCode.java src/test/java/dev/opentogether/InviteCodeTest.java
          java -cp build/code-tests dev.opentogether.InviteCodeTest
      - run: node --check cloudflare/src/index.js
      - name: Test Cloudflare invitations
        run: node --test cloudflare/test/*.test.mjs
      - name: Build Forge mod
        run: gradle --no-daemon clean build --stacktrace --info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opentogether-build
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: error
