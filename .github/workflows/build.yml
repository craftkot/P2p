name: Build OpenTogether

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - run: echo "GitHub hosted runner started"
      - uses: actions/checkout@v4
      - run: |
          pwd
          ls -la
          test -f build.gradle
  build:
    needs: sanity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - run: node --check cloudflare/src/index.js
      - name: Build Forge mod
        run: gradle --no-daemon build --stacktrace --info
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opentogether-build
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
