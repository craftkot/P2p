plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'dev.opentogether'
version = project.mod_version

base {
    archivesName = 'opentogether-fabric-26.3'
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        opentogether {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"

    // No embedded e4mc and no relay. Minecraft's normal TCP handles LAN/direct hosts.
    // Fabric API is needed by the client screen and chunk diagnostics hooks.
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    include "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('jar', Jar) {
    from(rootProject.file('../src/main/resources/licenses/e4mc-MIT.txt')) {
        into('META-INF/licenses')
    }
}
