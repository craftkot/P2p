plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'dev.opentogether'
version = '0.5.0-alpha'

base {
    archivesName = 'opentogether-forge-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// ForgeGradle 6 official dependency packaging; e4mc remains a separate, MIT-licensed
// nested mod at runtime, but the player installs only one physical OpenTogether JAR.
jarJar.enable()

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                opentogether { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'
    jarJar('curse.maven:e4mc-849519:9030240') {
        jarJar.pin(it, '[9030240,9030241)')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ForgeGradle must reobfuscate the client-distributable JAR.
tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

// ForgeGradle's jarJar task produces the -all.jar distributable.
tasks.named('jarJar').configure {
    finalizedBy 'reobfJarJar'
}
