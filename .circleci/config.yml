version: 2.1

jobs:
  build-forge:
    docker:
      - image: cimg/openjdk:17.0
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Download verified Gradle distribution
          command: |
            curl -fL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.1.1/bin/gradle --version
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "build.gradle" }}
            - gradle-v1-
      - run:
          name: Test Java 17 UDP/STUN parser
          command: |
            mkdir -p /tmp/opentogether-stun
            javac --release 17 -d /tmp/opentogether-stun src/main/java/dev/opentogether/StunProbe.java src/test/java/dev/opentogether/StunProbeTest.java
            java -cp /tmp/opentogether-stun dev.opentogether.StunProbeTest
      - run:
          name: Stage built-in e4mc
          command: bash ci/prepare-e4mc.sh
      - run:
          name: Compile Forge 1.20.1 mod
          command: |
            /tmp/gradle-8.1.1/bin/gradle --no-daemon clean build --stacktrace --info 2>&1 | tee /tmp/opentogether-build.log
      - save_cache:
          key: gradle-v1-{{ checksum "build.gradle" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - store_artifacts:
          path: build/libs
          destination: opentogether-jars
      - store_artifacts:
          path: /tmp/opentogether-build.log
          destination: build.log
      - store_artifacts:
          path: build/reports
          destination: reports

  test-cloudflare:
    docker:
      - image: cimg/node:22.15
    steps:
      - checkout
      - run:
          name: Run invitation broker regression tests
          command: node --test cloudflare/test/*.test.mjs
      - run:
          name: Check Worker syntax
          command: node --check cloudflare/src/index.js

workflows:
  forge-ci:
    jobs:
      - test-cloudflare
      - build-forge
